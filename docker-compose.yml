services:
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { if (rs.status().ok === 1) { quit(0); } }
          catch (error) {}
          const result = rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]});
          quit(result.ok === 1 ? 0 : 1);"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
